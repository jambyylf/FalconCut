<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FalconCut</title>
    <style>
        /*
         * FalconCut панелі: қараңғы фон, жұқа тор, күлгін жарқыл және «шыны» карточкалар.
         * Бұл файл тек көріністі сипаттайды. bridge-cep.js күтетін id және onclick
         * атаулары (startButton, connectionText, tempDirectory, logContainer ...) сақталған.
         */

        /* Қаріп желіден емес, панельдің қасындағы файлдан жүктеледі (қазақ әріптері бар) */
        @font-face {
            font-family: "Montserrat";
            src: url("fonts/Montserrat-Kazakh.woff2") format("woff2");
            font-weight: 400 800;
            font-style: normal;
        }

        :root {
            --bg: #08080E;
            --violet: #A855F7;
            --lilac: #C4B5FD;
            --cyan: #22D3EE;
            --accent: linear-gradient(135deg, #A855F7 0%, #C4B5FD 55%, #22D3EE 100%);
            --grid-line: rgba(168, 85, 247, 0.07);
            --glow: rgba(168, 85, 247, 0.32);
            --text: #ECE9F5;
            --text-muted: #A9A4BC;
            --text-faint: #6F6A84;
            --glass: rgba(22, 17, 38, 0.58);
            --glass-strong: rgba(30, 22, 52, 0.72);
            --glass-border: rgba(168, 85, 247, 0.26);
            --glass-border-strong: rgba(196, 181, 253, 0.5);
            --field: rgba(6, 6, 12, 0.78);
            --success: #22C55E;
            --error: #F43F5E;
            --warning: #FBBF24;
            --idle: #6B7280;
            --mono: "SF Mono", SFMono-Regular, Menlo, Consolas, "Cascadia Mono", "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            position: relative;
            padding: 14px 12px 18px;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 12px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        /* Жұқа тор: жоғарыда анық, төмен қарай біртіндеп жоғалады */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 75%);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 75%);
        }

        /* Жоғарғы оң бұрыштағы күлгін жұмсақ жарқыл */
        body::after {
            content: "";
            position: fixed;
            top: -140px;
            right: -120px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, var(--glow) 0%, rgba(168, 85, 247, 0.08) 45%, transparent 70%);
        }

        /* flex gap ескі CEP (Chromium 74) нұсқаларында жоқ, сондықтан grid қолданылады */
        .shell {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            row-gap: 10px;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ---- Жоғарғы бөлік: логотип және күй ---- */
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 2px 6px;
        }

        .logo {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            background: var(--accent);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-sub {
            margin-top: 3px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.42em;
            color: var(--lilac);
            opacity: 0.75;
        }

        .logo-sub #panelVersion {
            margin-left: 4px;
            letter-spacing: 0.06em;
            font-weight: 500;
            color: var(--text-faint);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            margin-left: 10px;
            padding: 6px 11px 6px 9px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: 0 0 auto;
            margin-right: 7px;
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18), 0 0 10px rgba(34, 197, 94, 0.6);
        }

        .status-dot.disconnected {
            background: var(--idle);
            box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.18);
        }

        /* ---- «Шыны» карточкалар ---- */
        .card {
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 40%),
                var(--glass);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 10px 26px rgba(0, 0, 0, 0.42);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .card-title {
            margin: 0 0 9px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--lilac);
        }

        /* ---- Батырмалар ---- */
        .actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            row-gap: 8px;
        }

        .actions-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 8px;
        }

        .btn {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            padding: 10px 10px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(168, 85, 247, 0.08);
            color: var(--text);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.2;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
        }

        .btn:hover:enabled {
            border-color: var(--glass-border-strong);
            background: rgba(168, 85, 247, 0.16);
        }

        .btn:active:enabled {
            transform: translateY(1px);
        }

        .btn.primary {
            border: 0;
            background: var(--accent);
            color: #0B0816;
            font-weight: 700;
            box-shadow: 0 8px 22px rgba(168, 85, 247, 0.3);
        }

        .btn.primary:hover:enabled {
            background: var(--accent);
            box-shadow: 0 8px 26px rgba(34, 211, 238, 0.28);
        }

        .btn:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        .btn:focus-visible,
        .field:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        /* ---- Өрістер ---- */
        .field-label {
            display: block;
            margin: 12px 0 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .field {
            width: 100%;
            padding: 9px 11px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--field);
            color: var(--text);
            font-family: var(--mono);
            font-size: 11px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .field::placeholder {
            color: var(--text-faint);
        }

        .field:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.18);
        }

        select.field {
            font-family: inherit;
            font-size: 12px;
        }

        select.field option {
            background: #120F1F;
            color: var(--text);
        }

        /* ---- Соңғы команда ---- */
        .last-empty {
            color: var(--text-faint);
            font-size: 11px;
        }

        .last-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .last-tool {
            margin-right: 8px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--lilac);
        }

        .last-time {
            margin-top: 4px;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-faint);
        }

        .result-badge {
            flex: 0 0 auto;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .result-badge.success {
            color: var(--success);
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.35);
        }

        .result-badge.error {
            color: var(--error);
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.38);
        }

        [hidden] {
            display: none !important;
        }

        /* ---- Журнал: айналатын терезе, моноширинді шрифт ---- */
        .log {
            height: 210px;
            overflow-y: auto;
            padding: 8px 9px;
            border-radius: 10px;
            border: 1px solid rgba(168, 85, 247, 0.16);
            background: rgba(4, 4, 9, 0.82);
            font-family: var(--mono);
            font-size: 10.5px;
            line-height: 1.55;
        }

        .log-entry {
            padding: 1px 0 1px 8px;
            margin-bottom: 3px;
            border-left: 2px solid rgba(168, 85, 247, 0.45);
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-entry.warning {
            border-left-color: var(--warning);
            color: #F4D98B;
        }

        .log-entry.error {
            border-left-color: var(--error);
            color: #FDA4B4;
        }

        .log::-webkit-scrollbar {
            width: 6px;
        }

        .log::-webkit-scrollbar-thumb {
            border-radius: 6px;
            background: rgba(168, 85, 247, 0.35);
        }

        .log::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ---- Қосымша (әдепкіде жабық) ---- */
        details.more summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            list-style: none;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        details.more summary::-webkit-details-marker {
            display: none;
        }

        details.more summary::after {
            content: "";
            width: 7px;
            height: 7px;
            border-right: 2px solid var(--lilac);
            border-bottom: 2px solid var(--lilac);
            transform: rotate(45deg);
            transition: transform 0.15s ease;
        }

        details.more[open] summary::after {
            transform: rotate(-135deg);
        }

        details.more .field-label:first-of-type {
            margin-top: 12px;
        }

        details.more .actions-row {
            margin-top: 10px;
        }

    </style>
</head>
<body>
    <!--
        FalconCut: data-i18n белгісі бар элементтердің мәтіні locales/<тіл>.json-нан алынады
        (bridge-cep.js → applyTranslations). Мұндағы қазақша мәтін — аударма файлы
        табылмаған жағдайға арналған әдепкі нұсқа, ол kk.json-мен бірдей болуы керек.
    -->
    <div class="shell">
        <header class="brand">
            <div>
                <h1 class="logo">FalconCut</h1>
                <div class="logo-sub">ONAIR<span id="panelVersion"></span></div>
            </div>
            <div class="status-pill" role="status" aria-live="polite">
                <span class="status-dot disconnected" id="connectionStatus"></span>
                <span id="connectionText" data-i18n="panel.status.disconnected">Ажыратылған</span>
            </div>
        </header>

        <section class="card">
            <div class="actions">
                <button class="btn primary" type="button" onclick="startBridge()" id="startButton" data-i18n="panel.controls.start">Көпірді іске қосу</button>
                <div class="actions-row">
                    <button class="btn" type="button" onclick="stopBridge()" id="stopButton" disabled data-i18n="panel.controls.stop">Көпірді тоқтату</button>
                    <button class="btn" type="button" onclick="location.reload()" id="reloadButton" data-i18n="panel.controls.reload">Қайта жүктеу</button>
                </div>
            </div>
            <label class="field-label" for="tempDirectory" data-i18n="panel.config.temp_label">Уақытша папка</label>
            <input class="field" type="text" id="tempDirectory" spellcheck="false" onchange="saveConfig()" data-i18n-placeholder="panel.config.temp_placeholder" placeholder="Уақытша папка">
        </section>

        <section class="card">
            <h2 class="card-title" data-i18n="panel.last.title">Соңғы команда</h2>
            <div class="last-empty" id="lastCommandEmpty" data-i18n="panel.last.empty">Әзірге команда болған жоқ</div>
            <div id="lastCommandBody" hidden>
                <div class="last-main">
                    <span class="last-tool" id="lastCommandTool"></span>
                    <span class="result-badge" id="lastCommandResult"></span>
                </div>
                <div class="last-time" id="lastCommandTime"></div>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title" data-i18n="panel.log.title">Журнал</h2>
            <div class="log" id="logContainer" role="log" aria-live="polite"></div>
        </section>

        <details class="card more">
            <summary data-i18n="panel.more.title">Қосымша</summary>
            <label class="field-label" for="languageSelect" data-i18n="panel.config.language_label">Тіл</label>
            <select class="field" id="languageSelect" onchange="changeLanguage(this.value)">
                <option value="kk">Қазақша</option>
                <option value="en">English</option>
            </select>
            <div class="actions-row">
                <button class="btn" type="button" onclick="runDiagnostics()" id="diagnosticsButton" data-i18n="panel.controls.diagnostics">Диагностика жасау</button>
                <button class="btn" type="button" onclick="clearLog()" id="clearButton" data-i18n="panel.controls.clear_log">Журналды тазалау</button>
            </div>
        </details>
    </div>

    <script src="CSInterface.js"></script>
    <script src="bridge-cep.js"></script>
</body>
</html>
